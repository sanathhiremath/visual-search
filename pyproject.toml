[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-search-demo"
version = "0.1"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13", "torch>=2.6,<3", "torchvision>=0.21,<1", "open_clip_torch>=2.30,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
